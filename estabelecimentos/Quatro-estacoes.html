<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">

<body>

    <!-- Estrutura principal. -->

    <div class="aplicacao">

        <!-- BARRA LATERAL -->

        <aside class="barra-lateral">

            <!-- Logo do Sabor SL -->
            <div class="logo-lateral">

                <!-- A barra lateral exibe somente a imagem da logo. -->
                <img class="imagem-logo-lateral" src="../img/logo.png" alt="Logo Sabor SL Delivery">

            </div>


            <!-- Menu de navegação -->
            <nav class="navegacao">

                <a href="../principal.html">
                    🏠 <span>Início</span>
                </a>

                <a class="ativo" href="../restaurantes.html">
                    🍽️ <span>Restaurantes</span>
                </a>

                <a href="../perfil.html">
                    ♙ <span>Perfil</span>
                </a>

                <a href="../configuracoes.html">

                </a>

            </nav>


            <!-- Informações do delivery -->
            <div class="entrega">
                🛵 <b>Delivery local</b>
                <br>
                Santa Luzia - PB

        </aside>

        <main class="principal">

            <!-- Botão para voltar -->
            <div class="barra-superior">

                <a class="voltar" href="../restaurantes.html">

          <!-- Perfil do estabelecimento -->

            <section class="restaurante">

                <img

                            Quatro Estações

                            <span class="etiqueta">

                                Santa Luzia - PB
                            </span>

                        </div>

                    </div>


                    <!--Botão que abre o WhatsApp -->
                    <a
                        class="contato-whatsapp"
                        href="https://wa.me/558399866982"
                        target="_blank"
                    >
                        💬 Pedir pelo WhatsApp
                    </a>

                </div>


                <!--CONTATO-->

                <div class="cardapio">

                    <h2>
                        Contato
                    </h2>


                    <div class="item-menu">

                        <div>

                            <h3>
                                  WhatsApp
                            </h3>


                            <!-- número -->
                            <p class="telefone">

                            </p>

                    </div>
